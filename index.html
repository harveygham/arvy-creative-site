<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arvy.creative | Video Production & Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased selection:bg-zinc-700">

    <!-- Full-Screen Video Hero Section -->
    <section class="relative w-full h-screen flex flex-col justify-center overflow-hidden">
        
        <!-- Background Video -->
        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 opacity-40">
            <source src="intro-bg.mp4" type="video/mp4">
        </video>
        
        <!-- Gradient division fade at the bottom of the video -->
        <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-zinc-950 to-transparent z-0"></div>

        <!-- Overlaid Header -->
        <header class="absolute top-0 inset-x-0 z-20 max-w-6xl mx-auto w-full p-6 md:p-12 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter text-white">arvy.creative.</h1>
            <nav class="hidden md:flex gap-8 text-sm font-medium tracking-wide">
                <a href="#work" class="hover:text-white transition-colors">WORK</a>
                <a href="#services" class="hover:text-white transition-colors">SERVICES</a>
                <a href="mailto:contact@arvycreative.co.uk" class="hover:text-white transition-colors">CONTACT</a>
            </nav>
        </header>

        <!-- Foreground Text -->
        <div class="relative z-10 max-w-6xl mx-auto w-full px-6 md:px-12 mt-12 md:mt-0">
            <h2 class="text-3xl md:text-5xl font-extrabold leading-tight text-white mb-6 drop-shadow-lg">
                Creative storytelling bringing <br class="hidden md:block">events & brands to life.
            </h2>
            <p class="text-lg text-zinc-300 max-w-2xl drop-shadow-md">
                Specialising in festival coverage, wedding videography, and drone operations. Delivering professional digital media from the ground and the air.
            </p>
        </div>
    </section>

    <!-- Main Content Section -->
    <main class="max-w-6xl mx-auto p-6 md:p-12 relative z-10">
        <section id="work" class="py-12">
            <h3 class="text-xl font-bold mb-8 uppercase tracking-widest text-zinc-500">Selected Work</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Video Embed 1 -->
                <div class="aspect-video bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 shadow-xl">
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="Showreel" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <!-- Video Embed 2 -->
                <div class="aspect-video bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 shadow-xl">
                     <iframe class="w-full h-full" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="Wedding Highlight" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </section>
    </main>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
                }
            });
        }
    </script>
</body>
</html>
